<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Device Management (Demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* styles.css — light, restrained admin theme. Tokens first, then layout, then components. */
:root {
  --bg: #f4f5f7; --surface: #fff; --ink: #18212b; --ink-2: #4a5565; --muted: #6b7686; --line: #e3e7ec; --line-2: #eef1f4;
  --accent: #17566b; --accent-hover: #11475a; --accent-soft: #e4f0f3;
  --green: #1f7a57; --green-bg: #e3f3ec; --blue: #2f5aa8; --blue-bg: #e7eefa; --amber: #8f5f05; --amber-bg: #fbf1da;
  --red: #b3362f; --red-bg: #fbe7e5; --grey: #566070; --grey-bg: #edeff2; --violet: #5f4fa3; --violet-bg: #eeebf8;
  --radius: 8px; --shadow: 0 1px 2px rgba(24, 33, 43, .05);
  --sidebar-w: 248px; --sidebar-w-collapsed: 68px; --topbar-h: 58px;
  font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
body.modal-open { overflow: hidden; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
code { background: var(--grey-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .spacer { flex: 1; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.icon { flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip-link { position: absolute; left: -999px; top: 8px; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 6px; z-index: 300; }
.skip-link:focus { left: 8px; }

/* ---------- shell ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; z-index: 60; transition: width .2s ease; }
.brand { height: var(--topbar-h); display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; white-space: nowrap; overflow: hidden; }
.brand-text small { color: var(--muted); font-size: 11px; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
.nav-link { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 7px; color: var(--ink-2); text-decoration: none; font-weight: 500; white-space: nowrap; overflow: hidden; }
.nav-link:hover { background: var(--bg); color: var(--ink); }
.nav-link.is-active { background: var(--accent-soft); color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.sidebar-foot { padding: 12px 16px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
.main { flex: 1; min-width: 0; margin-left: var(--sidebar-w); transition: margin-left .2s ease; display: flex; flex-direction: column; }
body.sidebar-collapsed .sidebar { width: var(--sidebar-w-collapsed); }
body.sidebar-collapsed .main { margin-left: var(--sidebar-w-collapsed); }
body.sidebar-collapsed .brand-text, body.sidebar-collapsed .nav-link span, body.sidebar-collapsed .sidebar-foot { display: none; }
body.sidebar-collapsed .brand { padding: 0 18px; } body.sidebar-collapsed .nav-link { justify-content: center; padding: 10px; }
.nav-scrim { display: none; }

.topbar { height: var(--topbar-h); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 20px; position: sticky; top: 0; z-index: 40; }
.search-wrap { position: relative; width: min(420px, 100%); }
.search-box { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 0 10px; height: 36px; color: var(--muted); min-width: 220px; }
.search-box:focus-within { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
.search-box input { border: 0; background: transparent; outline: 0; flex: 1; height: 100%; min-width: 0; color: var(--ink); }
.search-results { position: absolute; top: 42px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 12px 32px rgba(24,33,43,.14); max-height: 360px; overflow: auto; z-index: 70; padding: 6px; }
.sr-group { font-size: 11px; font-weight: 600; color: var(--muted); padding: 8px 8px 4px; }
.sr-item { display: flex; flex-direction: column; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px; border-radius: 6px; }
.sr-item:hover, .sr-item:focus-visible { background: var(--bg); }
.sr-item span { font-size: 12px; color: var(--muted); } .sr-empty { padding: 14px; color: var(--muted); }
.demo-pill { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--amber); background: var(--amber-bg); border: 1px solid #efd9a2; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.live-pill { color: var(--green); background: var(--green-bg); border-color: #bfe0d0; }
.profile { display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.profile-text { display: flex; flex-direction: column; line-height: 1.2; } .profile-text small { color: var(--muted); font-size: 11px; }

.page { padding: 24px 28px 48px; max-width: 1680px; width: 100%; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.breadcrumb { display: flex; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 4px; } .crumb-sep { opacity: .6; }
h1 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; outline: 0; }
.page-desc { color: var(--ink-2); margin-top: 2px; max-width: 70ch; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--bg); border-color: #cdd4dc; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; } .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { background: var(--red); border-color: var(--red); color: #fff; } .btn-danger:hover { background: #99302a; border-color: #99302a; }
.btn-ghost-danger { color: var(--red); border-color: #f0c9c6; } .btn-ghost-danger:hover { background: var(--red-bg); border-color: #e7aaa5; }
.btn-quiet { border-color: transparent; background: transparent; color: var(--ink-2); } .btn-quiet:hover { background: var(--bg); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; background: transparent; border-radius: 7px; color: var(--ink-2); }
.icon-btn:hover { background: var(--bg); color: var(--ink); } .icon-btn.sm { width: 30px; height: 30px; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; text-align: left; } .link:hover { text-decoration: underline; }
.spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- cards, metrics ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; flex-wrap: wrap; }
.card-head h2 { font-size: 15px; font-weight: 600; }
.count-pill { background: var(--grey-bg); color: var(--grey); font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.metric { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); }
.metric:hover { border-color: #c5ced8; }
.metric-label { color: var(--ink-2); font-size: 13px; font-weight: 500; }
.metric-value { font-size: 30px; font-weight: 600; line-height: 1.15; letter-spacing: -.02em; }
.metric-sub { font-size: 12px; color: var(--muted); }
.metric-amber { box-shadow: inset 0 3px 0 #d9a02b; } 
.chart-grid { display: grid; grid-template-columns: 1.7fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.chart-card .card-head { padding-bottom: 4px; } .chart-area { padding: 8px 16px 16px; }
.chart-scroll { overflow-x: auto; } .chart-box { position: relative; height: 300px; }
.tables-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; } .tables-grid.one { grid-template-columns: 1fr; }
.tables-grid .card { min-width: 0; }

/* ---------- filters, tables ---------- */
.filter-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 12px 14px; margin-bottom: 12px; }
.filter { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.filter select, .filter input { height: 36px; border: 1px solid var(--line); border-radius: 7px; background: #fff; padding: 0 8px; color: var(--ink); min-width: 130px; max-width: 200px; }
.filter-bar .search-box { flex: 1 1 260px; max-width: 360px; background: #fff; }
.results-card { overflow: hidden; }
.table-note { padding: 0 16px 8px; }
.table-wrap { overflow-x: auto; border-top: 1px solid var(--line); }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); background: #fafbfc; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.data-table.compact td { padding: 8px 10px; } .data-table.compact th { padding: 8px 10px; }
.data-table tbody tr:hover { background: #fafbfc; } .data-table tbody tr:last-child td { border-bottom: 0; }
.data-table .num { text-align: right; }
.th-sort { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: inherit; display: inline-flex; align-items: center; gap: 4px; }
.th-sort:hover { color: var(--ink); } .sort-ind { display: inline-block; width: 13px; }
.row-actions { display: flex; gap: 2px; align-items: center; } .row-actions.wrap { flex-wrap: wrap; gap: 6px; }
.pager { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); gap: 10px; flex-wrap: wrap; }
.pager-info { color: var(--muted); font-size: 12px; } .pager-btns { display: flex; gap: 4px; align-items: center; }
.pager-btn { min-width: 30px; height: 30px; padding: 0 6px; border: 1px solid var(--line); background: #fff; border-radius: 6px; display: inline-grid; place-items: center; }
.pager-btn:hover:not(:disabled) { background: var(--bg); } .pager-btn:disabled { opacity: .4; cursor: not-allowed; }
.pager-btn.is-current { background: var(--accent); border-color: var(--accent); color: #fff; } .pager-gap { color: var(--muted); }

/* ---------- badges, banners, states ---------- */
.badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; line-height: 1.6; }
.badge-green { background: var(--green-bg); color: var(--green); } .badge-blue { background: var(--blue-bg); color: var(--blue); } .badge-amber { background: var(--amber-bg); color: var(--amber); }
.badge-red { background: var(--red-bg); color: var(--red); } .badge-grey { background: var(--grey-bg); color: var(--grey); } .badge-violet { background: var(--violet-bg); color: var(--violet); }
.badge-ink { background: #fff; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: var(--radius); margin-bottom: 12px; border: 1px solid; }
.banner .icon { margin-top: 2px; }
.banner-danger { background: var(--red-bg); border-color: #f0c9c6; color: #7e2520; } .banner-warn { background: var(--amber-bg); border-color: #efd9a2; color: #6e4a05; }
.banner-ok { background: var(--green-bg); border-color: #bfe0d0; color: #155a40; } .banner-info { background: var(--blue-bg); border-color: #c6d6f2; color: #254a89; }
.state { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.state h3 { font-size: 15px; } .state p { color: var(--muted); max-width: 44ch; } .state .btn { margin-top: 8px; }
.state-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--grey-bg); color: var(--grey); display: grid; place-items: center; margin-bottom: 4px; }
.state-error .state-icon { background: var(--red-bg); color: var(--red); }
.sk { background: linear-gradient(90deg, #eceff2 25%, #f5f6f8 50%, #eceff2 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: var(--radius); }
@keyframes shimmer { to { background-position: -200% 0; } }
.skeleton-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 14px; } .sk-card { height: 96px; } .sk-charts { grid-template-columns: 1.7fr 1fr 1fr; } .sk-chart { height: 340px; grid-column: auto; }
.sk-bar { height: 62px; margin-bottom: 12px; } .sk-table { height: 360px; }

/* ---------- modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(24, 33, 43, .45); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; z-index: 100; }
.modal { background: var(--surface); border-radius: 10px; width: 100%; box-shadow: 0 24px 60px rgba(24,33,43,.3); display: flex; flex-direction: column; max-height: 90vh; animation: pop .14s ease-out; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } }
.modal-sm { max-width: 440px; } .modal-md { max-width: 620px; } .modal-lg { max-width: 820px; } .modal-xl { max-width: 960px; }
.modal-head { display: flex; justify-content: space-between; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 17px; font-weight: 600; } .modal-head p { color: var(--muted); font-size: 13px; margin-top: 2px; }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-foot { display: flex; gap: 8px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); background: #fafbfc; border-radius: 0 0 10px 10px; flex-wrap: wrap; }
.confirm-body { display: flex; gap: 12px; } .confirm-body p + p { margin-top: 6px; }
.confirm-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--blue-bg); color: var(--blue); display: grid; place-items: center; flex-shrink: 0; } .confirm-icon.danger { background: var(--red-bg); color: var(--red); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tab-btn { border: 0; background: none; padding: 9px 12px; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px; }
.tab-btn.is-active { color: var(--accent); border-bottom-color: var(--accent); } .tab-btn:hover { color: var(--ink); }
.actions-row { margin-top: 14px; display: flex; gap: 8px; }
.sub-h { font-size: 13px; font-weight: 600; margin-bottom: 8px; } .sub-h.spaced { margin-top: 18px; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; margin: 0; }
.kv-row { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line-2); } .kv-row dt { width: 42%; color: var(--muted); flex-shrink: 0; } .kv-row dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.info-panel { background: #fafbfc; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; margin: 8px 0 12px; } .info-panel .kv { grid-template-columns: 1fr; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

/* ---------- forms ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; } .form-grid.one { grid-template-columns: 1fr; } .form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0; } .span-2 { grid-column: 1 / -1; } .is-hidden { display: none !important; }
.field label { display: block; font-weight: 500; margin-bottom: 4px; } .req { color: var(--red); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid #cfd6de; border-radius: 7px; padding: 8px 10px; background: #fff; min-height: 36px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input[readonly], .field select:disabled { background: var(--bg); color: var(--ink-2); }
.hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
.field-error { font-size: 12px; color: var(--red); margin-top: 3px; font-weight: 500; } .field-error:empty { display: none; }
.field.has-error input, .field.has-error select, .field.has-error textarea { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-bg); }
.form-alert { background: var(--red-bg); color: #7e2520; border: 1px solid #f0c9c6; border-radius: var(--radius); padding: 9px 12px; margin-bottom: 14px; font-weight: 500; }
.rental-group { background: #fafbfc; border: 1px dashed #cfd6de; border-radius: var(--radius); padding: 14px; }
.csv-box { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; border: 1px solid var(--line); border-radius: 7px; padding: 10px; }

/* ---------- reports, settings ---------- */
.reports-layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 14px; align-items: start; }
.report-picker { padding: 6px; position: sticky; top: 74px; }
.report-item { display: flex; flex-direction: column; gap: 1px; text-align: left; width: 100%; border: 0; background: transparent; padding: 9px 10px; border-radius: 6px; }
.report-item span { font-size: 12px; color: var(--muted); } .report-item:hover { background: var(--bg); }
.report-item.is-active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); } .report-item.is-active strong { color: var(--accent); }
.report-select { display: none; margin-bottom: 12px; } .report-select select { max-width: none; width: 100%; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-bottom: 14px; }
.list-card { padding-bottom: 14px; } .chips { list-style: none; margin: 0; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 6px 2px 10px; font-size: 13px; }
.chip-x, .chip-lock { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); } .chip-x:hover { background: var(--red-bg); color: var(--red); }
.add-option { display: flex; gap: 8px; padding: 12px 16px 0; } .add-option input { flex: 1; min-width: 0; border: 1px solid #cfd6de; border-radius: 7px; padding: 0 10px; height: 30px; }
.lock-note { display: flex; gap: 6px; align-items: center; padding: 12px 16px 0; }
.demo-body { padding: 0 16px 16px; display: flex; gap: 20px; justify-content: space-between; align-items: center; flex-wrap: wrap; } .demo-body p { max-width: 62ch; } .demo-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- toasts ---------- */
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 200; max-width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; background: var(--ink); color: #fff; padding: 10px 6px 10px 12px; border-radius: 9px; box-shadow: 0 10px 28px rgba(24,33,43,.3); animation: pop .16s ease-out; }
.toast.leaving { opacity: 0; transition: opacity .18s; } .toast .icon-btn { color: #cfd6de; width: 28px; height: 28px; } .toast .icon-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
.toast-icon { margin-top: 1px; color: #6fd1a6; } .toast-error .toast-icon { color: #ff9a92; } .toast-info .toast-icon { color: #9fc2ff; }
.toast-text { display: flex; flex-direction: column; flex: 1; font-size: 13px; }

/* ---------- responsive ---------- */
@media (max-width: 1280px) { .metrics { grid-template-columns: repeat(3, 1fr); } .chart-grid { grid-template-columns: 1fr 1fr; } .chart-card.wide { grid-column: 1 / -1; } .skeleton-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 1100px) { .tables-grid { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); width: var(--sidebar-w) !important; transition: transform .2s; }
  body.nav-open .sidebar { transform: none; box-shadow: 0 0 40px rgba(24,33,43,.3); }
  body.nav-open .nav-scrim { display: block; position: fixed; inset: 0; background: rgba(24,33,43,.4); z-index: 55; }

/* utils.js — small, dependency-free helpers (dates, escaping, CSV, cloning). */
(function (g) {
  'use strict';

  const Dates = {
    fmt(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    },
    parse(iso) {
      const p = iso.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    },
    today() { return Dates.fmt(new Date()); },
    add(iso, n) { const d = Dates.parse(iso); d.setDate(d.getDate() + n); return Dates.fmt(d); },
    /** Whole days from a to b (positive when b is later). */
    diff(a, b) {
      const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
      return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
    },
    isValid(iso) { return typeof iso === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(iso) && Dates.fmt(Dates.parse(iso)) === iso; },
    display(iso) {
      if (!iso) return '—';
      return Dates.parse(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function clone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }

  /** Natural, null-last comparison used by every sortable table. */
  function compare(a, b) {
    const ae = a == null || a === '', be = b == null || b === '';
    if (ae && be) return 0;
    if (ae) return 1;
    if (be) return -1;
    if (typeof a === 'number' && typeof b === 'number') return a - b;
    return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
  }

  function debounce(fn, ms) {
    let t;
    return function () {
      const args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(ctx, args); }, ms == null ? 200 : ms);
    };
  }

  /** CSV with quoting and spreadsheet-formula-injection protection. */
  function toCSV(columns, rows) {
    const q = function (v) {
      v = v == null ? '' : String(v);
      if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;
      return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    };
    const lines = [columns.map(function (c) { return q(c.label); }).join(',')];
    rows.forEach(function (r) { lines.push(columns.map(function (c) { return q(r[c.key]); }).join(',')); });

  /* ------------------------------------------------------------------ basics */
  Rules.isOpen = function (a) { return OPEN.indexOf(a.Assignment_Status) !== -1; };

  /** Builds lookup maps. Maps hold REFERENCES to the state objects. */
  Rules.index = function (s) {

        rows: rows

    }

/* ===== auth.js ===== */
/* auth.js — the administrator session kept in this browser tab.
 * Sign-in happens on admin-login.html (username + password). The server answers with a random session token,
 * which is kept ONLY in sessionStorage (it disappears when the tab is closed). No password, password hash or
 * private key is ever stored here, and nothing in this file grants access: the server checks the token on every
 * request. Viewing the dashboard needs no sign-in at all. */
(function (g) {
  'use strict';
  const CFG = g.EDM_CONFIG || {};
  const KEY = 'edm-admin-session';
  let sess = null;

  function load() {
    try {
      const raw = g.sessionStorage && g.sessionStorage.getItem(KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      if (s && typeof s.token === 'string' && /^[0-9a-f]{64}$/.test(s.token)) sess = s;
    } catch (e) { sess = null; }
  }
  function save() {
    try {
      if (!g.sessionStorage) return;
      if (sess) g.sessionStorage.setItem(KEY, JSON.stringify(sess)); else g.sessionStorage.removeItem(KEY);
    } catch (e) { /* ignore */ }
  }
  load();

  const Auth = {
    loginUrl: 'admin-login.html',
    isConfigured: function () { return !!(CFG.WEB_APP_URL && /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(CFG.WEB_APP_URL)); },
    isAdmin: function () { return !!sess; },
    token: function () { return sess ? sess.token : null; },
    user: function () { return sess ? { username: sess.username, name: sess.name || sess.username } : null; },
    /** Called after every successful request, so the inactivity clock matches the server's. */
    touch: function () { if (sess) { sess.last = Date.now(); save(); } },
    /** True when the idle or the total session time (as announced by the server at sign-in) has run out. */
    clockExpired: function () {
      if (!sess) return false;
      const now = Date.now();
      return now - (sess.last || sess.started || now) > (sess.idle || 7200) * 1000 || now - (sess.started || now) > (sess.max || 21600) * 1000;
    },
    setToken: function (t) { if (sess && /^[0-9a-f]{64}$/.test(t)) { sess.token = t; sess.last = Date.now(); save(); } },
    clear: function () { sess = null; save(); }
  };
  g.Auth = Auth;
})(typeof window !== 'undefined' ? window : globalThis);

  <script>
/* ===== dataService.js ===== */
/* dataService.js — the ONLY layer the UI uses to read or change data.
 *
 * Two modes, chosen automatically:
 *  - SHEETS: config.js is present (the GitHub Pages / production setup). Anyone can read the reduced public data;
 *            every change is a request carrying an administrator session token, which the Apps Script web app verifies
 *            before it reads/writes the Google Sheet. There is NO demo data and NO browser storage of records in this mode.
 *  - DEMO:   no config.js (a local file or preview). Sample data in browser memory/localStorage, never shared.
 *
 * The public functions, their arguments and their results are identical in both modes,
 * so no page or dialog needs to know which mode it is in.
 */
(function (g) {
  'use strict';

  const CFG = g.EDM_CONFIG;                 // present only when config.js is loaded
  const LIVE = !!CFG;
  const STORAGE_KEY = 'edm-demo-state-v4';
  const REMOTE_TIMEOUT_MS = 45000;
  const SNAPSHOT_REUSE_MS = 1500;
  const config = { latencyMs: 140, failNext: false };
  const today = function () { return Dates.today(); };

  /* ================================================================== SHEETS MODE */
  const SESSION_CODES = ['SIGN_IN_REQUIRED', 'SESSION_EXPIRED'];

  /** One request to the Apps Script web app. Sent as text/plain so the browser allows it cross-origin. */
  async function post(method, args, token) {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, REMOTE_TIMEOUT_MS);
    let res;
    try {
      res = await fetch(CFG.WEB_APP_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: token, method: method, args: args || [] }),

      const timedOut = e && e.name === 'AbortError';
      throw new Error(timedOut ? 'The server took too long to respond. Reload the page to check whether your change was saved.'
        : 'Could not reach the server. Check your internet connection. If you were saving, reload and check the data before trying again.');
    }
    clearTimeout(timer);
    if (!res.ok) throw new Error('The server answered with an error (HTTP ' + res.status + '). Check the Apps Script deployment settings.');
    let body;
    try { body = await res.json(); }

    }
    return '<div class="field' + (d.span === 'full' ? ' span-2' : '') + (d.hidden ? ' is-hidden' : '') + '" data-field="' + d.name + '"><label for="' + id + '">' + esc(d.label) + (d.required ? '<span class="req" aria-hidden="true"> *</span>' : '') + '</label>' + ctl + (d.hint ? '<p class="hint">' + d.hint + '</p>' : '') + '<p class="field-error" id="' + id + '-err" role="alert"></p></div>';
  }
  const formGrid = function (fields) { return '<div class="form-grid">' + fields.map(field).join('') + '</div>'; };

  function collect(form) {
    const o = {};

      if (!el.name || el.type === 'submit' || el.type === 'button') return;

  function clearErrors(form) {

  }
  function showErrors(form, errors, summary) {
    clearErrors(form);
    let first = null, orphan = [];
    Object.keys(errors || {}).forEach(function (name) {

      if (!f) { orphan.push(errors[name]); return; }

  /* ------------------------------------------------------------------ tables */
  const tableState = {};
  function stateOf(id) { return tableState[id] = tableState[id] || { sort: null, page: 1 }; }

  function sortRows(rows, cols, sort) {
    if (!sort) return rows;
    const col = cols.filter(function (c) { return c.key === sort.key; })[0];
    if (!col) return rows;
    const val = col.sortValue || function (r) { return r[col.key]; };

  }

  function table(o) {
    const st = stateOf(o.id), size = o.pageSize || 10;
    let rows = sortRows(o.rows, o.columns, st.sort);
    const total = rows.length;
    const pages = Math.max(1, Math.ceil(total / size));
    if (st.page > pages) st.page = pages;

    if (!total) return o.emptyHtml || empty({ title: 'Nothing to show', text: 'No records match the current filters.' });

    const head = o.columns.map(function (c) {
      const sorted = st.sort && st.sort.key === c.key ? st.sort.dir : null;
      const inner = c.sortable !== false && !o.noSort
        ? '<button type="button" class="th-sort" data-sort="' + o.id + '|' + c.key + '">' + esc(c.label) + '<span class="sort-ind">' + (sorted === 'asc' ? icon('up', 13) : sorted === 'desc' ? icon('down', 13) : '') + '</span></button>'
        : esc(c.label);

        return '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + html + '</td>';
      }).join('') + '</tr>';
    }).join('');

    let pager = '';
    if (!o.noPaging && total > size) {
      const from = (st.page - 1) * size + 1, to = Math.min(total, st.page * size);
      const nums = [];
      for (let p = 1; p <= pages; p++) if (p === 1 || p === pages || Math.abs(p - st.page) <= 1) nums.push(p);
      let btns = '', prev = 0;
      nums.forEach(function (p) {
        if (p - prev > 1) btns += '<span class="pager-gap">…</span>';
        btns += '<button type="button" class="pager-btn' + (p === st.page ? ' is-current' : '') + '" data-page="' + o.id + '|' + p + '"' + (p === st.page ? ' aria-current="page"' : '') + ' aria-label="Page ' + p + '">' + p + '</button>';

    } else if (!o.noPaging) {
      pager = '<div class="pager"><span class="pager-info">' + total + ' record' + (total === 1 ? '' : 's') + '</span></div>';
    }
    return '<div class="table-wrap" tabindex="0"><table class="data-table' + (o.compact ? ' compact' : '') + '"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>' + pager;
  }

  /* ------------------------------------------------------------ misc builders */
  function empty(o) {
    return '<div class="state state-empty"><span class="state-icon">' + icon(o.icon || 'box', 26) + '</span><h3>' + esc(o.title) + '</h3>' + (o.text ? '<p>' + esc(o.text) + '</p>' : '') + (o.actionHtml || '') + '</div>';
  }

    return '<div class="state state-error" role="alert"><span class="state-icon">' + icon('alert', 26) + '</span><h3>Something went wrong</h3><p>' + esc(message || 'The data could not be loaded.') + '</p><button class="btn btn-primary" type="button" data-action="retry">' + icon('refresh', 16) + 'Try again</button></div>';

    return '<div class="sk sk-bar"></div><div class="sk sk-table"></div>';
  }
  /** Assignment status badge (Active / Returned / Cancelled). */
  const asgStatus = function (r) { return badge(r.Assignment_Status); };
  function kv(pairs) {
    return '<dl class="kv">' + pairs.filter(function (p) { return p; }).map(function (p) { return '<div class="kv-row' + (p.wide ? ' wide' : '') + '"><dt>' + esc(p[0]) + '</dt><dd>' + (p.html !== undefined ? p.html : (p[2] ? p[1] : esc(p[1] == null || p[1] === '' ? '—' : p[1]))) + '</dd></div>'; }).join('') + '</dl>';
  }

  <script>

      '<h3 class="sub-h spaced">Allotment details</h3><div class="form-grid">' +

  function resetFile() { Bulk.fileName = ''; Bulk.headers = []; Bulk.rows = []; Bulk.clientErrors = {}; Bulk.fileErrors = []; Bulk.preview = null; Bulk.error = ''; Bulk.confirmUpdate = false; }
  const cat = function () { return Bulk.info.categories[Bulk.category]; };
  const rerender = function () { if (document.getElementById('bulk-root')) drawBulk(); };

  /* ------------------------------------------------------------------ guide + template */
  function columnNotes(h) {
    const c = cat(), parts = [];
    if (ID_NOTE[h] && h === c.idField) parts.push(ID_NOTE[h]);
    if (Bulk.category === 'returns' && (h === 'Device_ID' || h === 'Employee_ID')) parts.push('Optional. If filled, it must match the assignment.');
    if (c.dateColumns.indexOf(h) !== -1) parts.push('Date as YYYY-MM-DD, for example 2026-03-31.');
    const ln = LIST_FOR[h];
    if (ln && App.data && App.data.lists[ln] && !(Bulk.category === 'devices' && h === 'Current_Status' && Bulk.mode !== 'update' && false)) {
      if (['Department', 'Designation', 'Brand'].indexOf(h) === -1) parts.push('One of: ' + App.data.lists[ln].join(', ') + '.');
    }
    if (h === 'Last_Working_Date') parts.push('Required when the status is Notice Period or Exited.');
    if (h === 'Rental_Vendor') parts.push('Required when ownership is Rented.');
    if (h === 'Current_Status' && Bulk.category === 'devices') parts.push('New devices cannot start as Assigned. Use the allotment upload for that.');
    if (h === 'Condition_At_Return') parts.push('Damaged devices go to Under Repair; New/Good become Available; Fair becomes Available.');
    if (h === 'Missing_Items') parts.push('Free text. For a lost device use "Resolve as lost" in the dashboard.');
    return parts.join(' ');
  }
  function downloadTemplate() {
    const c = cat();
    const text = toCSV(c.headers.map(function (h) { return { key: h, label: h }; }), []);
    saveBlob('\ufeff' + text + '\r\n', 'template-' + Bulk.category + '.csv');
  }
  function saveBlob(text, name) {
    try {
      const blob = new Blob([text], { type: 'text/csv;charset=utf-8' }), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      UI.toast(name + ' downloaded.', 'success', 'Downloaded');
    } catch (err) { UI.toast('The file could not be created.', 'error', 'Download failed'); }
  }

  /* ------------------------------------------------------------------ reading a chosen file */
  async function onFile(file) {
    resetFile();
    if (!file) { rerender(); return; }
    Bulk.fileName = file.name;
    if (!/\.csv$/i.test(file.name)) Bulk.fileErrors.push('This does not look like a .csv file. Save your spreadsheet as "CSV (comma delimited)" and try again.');
    if (file.size > MAX_FILE_BYTES) Bulk.fileErrors.push('The file is ' + Math.round(file.size / 1024) + ' KB. The limit is ' + (MAX_FILE_BYTES / 1024) + ' KB. Split it into smaller files.');
    if (Bulk.fileErrors.length) { rerender(); return; }
    let table;
    try { table = parseCSV(await file.text()); } catch (err) { Bulk.fileErrors.push(err.message); rerender(); return; }
    if (!table.length) { Bulk.fileErrors.push('The file is empty.'); rerender(); return; }
    const c = cat(), headers = table[0].map(function (h) { return String(h).trim(); });
    const seen = {};
    headers.forEach(function (h) {
      if (c.headers.indexOf(h) === -1) Bulk.fileErrors.push('Unknown column "' + h + '". Use the downloaded template; column names must match exactly.');
      if (seen[h]) Bulk.fileErrors.push('The column "' + h + '" appears more than once.');
      seen[h] = true;
    });
    if (Bulk.mode !== 'update') c.requiredColumns.forEach(function (h) { if (!seen[h]) Bulk.fileErrors.push('The required column "' + h + '" is missing.'); });
    else if (!seen[c.idField]) Bulk.fileErrors.push('Update mode needs the "' + c.idField + '" column.');
    const data = table.slice(1);
    if (!data.length) Bulk.fileErrors.push('The file has no data rows.');
    if (data.length > Bulk.info.maxRows) Bulk.fileErrors.push('The file has ' + data.length + ' rows. The limit is ' + Bulk.info.maxRows + ' rows per upload. Split it into parts.');
    data.forEach(function (r) { if (r.length > headers.length) Bulk.fileErrors.push('Row ' + (data.indexOf(r) + 2) + ' has more cells than there are column headers.'); });
    if (Bulk.fileErrors.length) { rerender(); return; }
    Bulk.headers = headers;
    Bulk.rows = data.map(function (r) { const o = {}; headers.forEach(function (h, i) { o[h] = r[i] === undefined ? '' : String(r[i]); }); return o; });
    clientCheck();
    await runPreview();
  }

  /** Quick checks in the browser. The server repeats them (and more) and has the final word. */
  function clientCheck() {
    const c = cat(), ids = {}; Bulk.clientErrors = {};
    const add = function (n, f, m) { (Bulk.clientErrors[n] = Bulk.clientErrors[n] || []).push({ field: f, message: m }); };
    Bulk.rows.forEach(function (r, i) {
      const n = i + 2;
      Bulk.headers.forEach(function (h) {
        const v = String(r[h]).trim();
        if (/^[=+\-@]/.test(v)) add(n, h, 'Values may not start with = + - or @ (they can be run as a spreadsheet formula). Remove that character.');
        if (c.dateColumns.indexOf(h) !== -1 && v && !DATE_RE.test(v)) add(n, h, 'Use the date format YYYY-MM-DD (for example 2026-03-31) in ' + h + '.');
        if (Bulk.mode !== 'update' && c.requiredColumns.indexOf(h) !== -1 && !v) add(n, h, h + ' is required.');
      });
      const id = String(r[c.idField] || '').trim().toLowerCase();
      if (id) { if (ids[id]) add(n, c.idField, 'Duplicate ID in this file (also in row ' + ids[id] + ').'); else ids[id] = n; }
    });
  }

  async function runPreview() {
    Bulk.busy = true; Bulk.error = ''; rerender();
    try { Bulk.preview = await DataService.bulkPreview(Bulk.category, Bulk.mode, Bulk.headers, Bulk.rows); }
    catch (err) { Bulk.preview = null; Bulk.error = err.message || 'The file could not be checked.'; }
    Bulk.busy = false; rerender();
  }

  /** Server messages win; a browser-only message is added when the server did not flag that column. */
  function rowMessages(r) {
    const cl = Bulk.clientErrors[r.row] || [], out = r.errors.slice();
    cl.forEach(function (e) { if (!out.some(function (s) { return s.field === e.field; })) out.push(e); });
    return out;
  }

  /* ------------------------------------------------------------------ import */
  async function confirmImport() {
    const p = Bulk.preview; if (!p || Bulk.busy) return;
    const n = p.counts.valid;
    const ok = await UI.confirm({ title: 'Import ' + n + ' row' + (n === 1 ? '' : 's') + '?', confirmText: 'Import now', message: '<p>' + n + ' ' + E(cat().label.toLowerCase()) + ' row' + (n === 1 ? '' : 's') + ' will be written to the spreadsheet. The file is checked again on the server first.</p>' + (p.counts.rejected ? '<p><strong>' + p.counts.rejected + ' row(s) with errors will be skipped.</strong></p>' : '') + '<p>Nothing is deleted. This cannot be undone from here.</p>' });
    if (!ok) return;
    Bulk.busy = true; rerender();
    try {
      const res = await DataService.bulkImport(Bulk.category, Bulk.mode, Bulk.headers, Bulk.rows, { strict: Bulk.strict, confirmUpdate: Bulk.mode === 'update' && Bulk.confirmUpdate });
      Bulk.result = res; Bulk.preview = null; const label = cat().label; const rows = Bulk.rows, headers = Bulk.headers;
      Bulk.rows = []; Bulk.headers = []; Bulk.fileName = ''; Bulk.clientErrors = {}; Bulk.busy = false;
      Bulk.result.rowsSent = rows.length; void headers;
      await App.afterChange(res.committed ? ('Import finished: ' + res.counts.insert + ' added, ' + res.counts.update + ' updated (' + label + ').') : null);
      if (!res.committed) UI.toast(res.reason || 'Nothing was imported.', 'error', 'Not imported');
    } catch (err) {
      Bulk.busy = false; Bulk.error = err.message || 'The import failed.'; UI.toast(Bulk.error, 'error', 'Import failed'); rerender();
    }
  }

  function errorReport() {
    const src = Bulk.result || Bulk.preview; if (!src) return;
    const rows = [];
    src.rows.forEach(function (r) {
      if (r.status !== 'error') return;
      const msgs = (Bulk.result ? r.errors : rowMessages(r)).map(function (e) { return (e.field ? e.field + ': ' : '') + e.message; }).join(' | ');
      rows.push({ Row: r.row, ID: r.id, Problem: msgs });
    });
    (src.fileErrors || []).forEach(function (m) { rows.push({ Row: '', ID: '', Problem: m }); });
    saveBlob('\ufeff' + toCSV([{ key: 'Row', label: 'Row' }, { key: 'ID', label: 'ID' }, { key: 'Problem', label: 'Problem' }], rows) + '\r\n', 'import-errors-' + Bulk.category + '-' + Dates.today() + '.csv');
  }

  /* ------------------------------------------------------------------ drawing */
  function summaryName(r) {
    const d = r.data || {};
    const pick = Bulk.category === 'employees' ? [d.Employee_Name, d.Department] : Bulk.category === 'devices' ? [d.Asset_Tag, d.Brand, d.Model] : Bulk.category === 'assignments' ? [d.Employee_ID, d.Device_ID] : [d.Assignment_ID, d.Physical_Return_Date];
    return pick.filter(Boolean).join(' · ');
  }
  function metric(label, value, sub, tone) { return '<div class="metric ' + (tone ? 'metric-' + tone : '') + '"><span class="metric-label">' + E(label) + '</span><span class="metric-value">' + value + '</span>' + (sub ? '<span class="metric-sub">' + E(sub) + '</span>' : '') + '</div>'; }
  function resultBadge(r) { return r.status === 'ok' ? B(r.action === 'update' ? 'Will update' : 'Will add', 'green') : r.status === 'skip' ? B('No change', 'grey') : B('Rejected', 'red'); }

  function guideCard() {
    const c = cat();
    const rows = c.headers.map(function (h) { return { col: h, req: Bulk.mode === 'update' ? (h === c.idField ? 'Yes' : 'No') : (c.requiredColumns.indexOf(h) !== -1 ? 'Yes' : 'Optional'), note: columnNotes(h) }; });
    const note = Bulk.mode === 'update'
      ? '<p class="muted small" style="padding:0 16px 8px">Update mode: only <strong>' + E(c.idField) + '</strong> is needed, plus the columns you want to change. <strong>Empty cells keep the current value</strong> — they never erase data.</p>'
      : Bulk.category === 'assignments' ? '<p class="muted small" style="padding:0 16px 8px">Status, return date and return ID are filled in by the system, so they are not in this template. The device becomes Assigned automatically, exactly as in Device Allotment.</p>'
      : Bulk.category === 'returns' ? '<p class="muted small" style="padding:0 16px 8px">Each assignment can be returned once. The assignment is closed and the device status is set by the same rules as the Returns page.</p>' : '';
    return '<details class="card" style="margin-bottom:12px"><summary class="card-head" style="cursor:pointer"><h2>Column guide for ' + E(c.label) + '</h2><span class="muted small">What each column of the template means</span></summary>' + note +
      UI.table({ id: 'bulk-guide', columns: [{ key: 'col', label: 'Column', sortable: false }, { key: 'req', label: 'Required', sortable: false }, { key: 'note', label: 'Notes', sortable: false }], rows: rows, noPaging: true, noSort: true, compact: true }) + '</details>';
  }

  function previewCard() {
    if (Bulk.busy && !Bulk.preview) return '<section class="card" style="margin-bottom:12px"><div class="card-head"><h2>Checking <strong>' + E(Bulk.fileName) + '</strong>…</h2></div><p class="muted" style="padding:0 16px 16px">Every row is being validated on the server. Nothing is saved yet.</p></section>';
    if (Bulk.error) return '<div class="banner banner-danger" role="alert">' + I('alert', 18) + '<div>' + E(Bulk.error) + '</div></div>';
    const p = Bulk.preview;
    const fileErrs = Bulk.fileErrors.concat(p ? p.fileErrors : []);
    if (fileErrs.length) return '<div class="banner banner-danger" role="alert">' + I('alert', 18) + '<div><strong>This file cannot be imported yet.</strong><ul style="margin:6px 0 0 18px">' + fileErrs.map(function (m) { return '<li>' + E(m) + '</li>'; }).join('') + '</ul></div></div>';
    if (!p) return '';
    const c = p.counts, update = Bulk.mode === 'update';
    const clientBad = Object.keys(Bulk.clientErrors).length;
    const blockedStrict = Bulk.strict && c.rejected > 0;
    const canGo = c.valid > 0 && !blockedStrict && (!update || Bulk.confirmUpdate) && !Bulk.busy;
    let list = p.rows.filter(function (r) { return !Bulk.onlyErrors || r.status === 'error'; });
    const cols = [
      { key: 'row', label: 'Row', sortable: false }, { key: 'status', label: 'Result', sortable: false, render: resultBadge },
      { key: 'id', label: 'ID', sortable: false }, { key: 'sum', label: 'Details', sortable: false, render: function (r) { return E(summaryName(r) || '—'); } },
      { key: 'msg', label: 'What was found', sortable: false, render: function (r) {
        if (r.status === 'error') return '<ul class="bulk-msgs">' + rowMessages(r).map(function (e) { return '<li class="bulk-err">' + (e.field ? '<strong>' + E(e.field) + ':</strong> ' : '') + E(e.message) + '</li>'; }).join('') + '</ul>';
        if (r.action === 'update') return '<ul class="bulk-msgs">' + r.changes.map(function (x) { return '<li class="bulk-chg"><strong>' + E(x.field) + ':</strong> ' + E(x.from || '—') + ' → ' + E(x.to || '—') + '</li>'; }).join('') + '</ul>';
        return r.note ? E(r.note) : '<span class="muted">Ready</span>';
      } }
    ];
    const tbl = UI.table({ id: 'bulk-preview', columns: cols, rows: list, pageSize: 15, noSort: true, emptyHtml: UI.empty({ title: 'No rows to show', text: 'There are no rows with errors.', icon: 'check' }) });
    return '<section class="card" style="margin-bottom:12px"><div class="card-head"><h2>Preview of <strong>' + E(Bulk.fileName) + '</strong></h2><span class="muted small">Nothing has been saved yet. Row 1 is the header; row numbers count records.</span></div>' +
      '<div class="metrics" style="padding:0 16px">' + metric('Rows in file', p.total) + metric('Valid', c.valid, update ? c.update + ' to update' : c.insert + ' to add', 'ok') + metric('Rejected', c.rejected, c.rejected ? 'will be skipped' : 'none', c.rejected ? 'danger' : '') + metric(update ? 'No change' : 'To add', update ? c.skipped : c.insert) + metric(update ? 'To update' : 'Skipped', update ? c.update : c.skipped) + '</div>' +
      '<div style="padding:0 16px 8px;display:flex;gap:16px;flex-wrap:wrap;align-items:center"><label class="bulk-check"><input type="checkbox" data-bulk="onlyErrors"' + (Bulk.onlyErrors ? ' checked' : '') + '> Show only rows with errors</label>' + (c.rejected ? '<button class="btn btn-sm" type="button" data-action="bulk-errors">' + I('download', 15) + 'Download error report</button>' : '') + '</div>' +
      tbl +
      '<div style="padding:14px 16px;border-top:1px solid var(--line)">' +
        '<label class="bulk-check"><input type="checkbox" data-bulk="strict"' + (Bulk.strict ? ' checked' : '') + '> Cancel the whole import if any row has an error <span class="muted small">(recommended)</span></label>' +
        (update ? '<label class="bulk-check"><input type="checkbox" data-bulk="confirmUpdate"' + (Bulk.confirmUpdate ? ' checked' : '') + '> I understand this will <strong>change ' + c.update + ' existing record' + (c.update === 1 ? '' : 's') + '</strong>.</label>' : '') +
        (blockedStrict ? '<p class="bulk-err small" style="margin:6px 0">Fix the ' + c.rejected + ' row(s) with errors and upload the file again, or untick the box above to import only the valid rows.</p>' : '') +
        (clientBad && !c.rejected ? '<p class="muted small" style="margin:6px 0">Some problems were found in your browser. Fix them and upload again.</p>' : '') +
        '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn btn-primary" type="button" data-action="bulk-confirm"' + (canGo ? '' : ' disabled') + '>' + I('upload', 16) + 'Confirm import (' + c.valid + ')</button><button class="btn" type="button" data-action="bulk-cancel">Cancel</button></div>' +
      '</div></section>';
  }

  function resultCard() {
    const r = Bulk.result; if (!r) return '';
    const bad = r.rows.filter(function (x) { return x.status === 'error'; });
    const head = r.committed ? '<div class="banner banner-ok" role="status">' + I('check', 18) + '<div><strong>Import finished.</strong> ' + r.counts.insert + ' added, ' + r.counts.update + ' updated, ' + r.counts.skipped + ' unchanged, ' + r.counts.rejected + ' rejected.</div></div>'
      : '<div class="banner banner-warn" role="alert">' + I('alert', 18) + '<div><strong>Nothing was imported.</strong> ' + E(r.reason || '') + '</div></div>';
    const tbl = bad.length ? UI.table({ id: 'bulk-result', columns: [{ key: 'row', label: 'Row', sortable: false }, { key: 'id', label: 'ID', sortable: false }, { key: 'msg', label: 'Why it was rejected', sortable: false, render: function (x) { return '<ul class="bulk-msgs">' + x.errors.map(function (e) { return '<li class="bulk-err">' + (e.field ? '<strong>' + E(e.field) + ':</strong> ' : '') + E(e.message) + '</li>'; }).join('') + '</ul>'; } }], rows: bad, pageSize: 10, noSort: true }) : '';
    return '<section class="card" style="margin-bottom:12px"><div class="card-head"><h2>Result of the last import</h2><span class="muted small">' + E(r.label || '') + '</span></div><div style="padding:0 16px 12px">' + head + '</div>' +
      '<div class="metrics" style="padding:0 16px"><div class="metric metric-ok"><span class="metric-label">Added</span><span class="metric-value">' + r.counts.insert + '</span></div><div class="metric"><span class="metric-label">Updated</span><span class="metric-value">' + r.counts.update + '</span></div><div class="metric"><span class="metric-label">Skipped (no change)</span><span class="metric-value">' + r.counts.skipped + '</span></div><div class="metric ' + (r.counts.rejected ? 'metric-danger' : '') + '"><span class="metric-label">Rejected</span><span class="metric-value">' + r.counts.rejected + '</span></div></div>' + tbl +
      '<div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap">' + (bad.length ? '<button class="btn btn-sm" type="button" data-action="bulk-errors">' + I('download', 15) + 'Download error report</button>' : '') + '<button class="btn btn-sm" type="button" data-action="bulk-clear-result">Dismiss</button></div></section>';
  }

  function drawBulk() {
    const root = document.getElementById('bulk-root'); if (!root) return;
    const c = cat(), keep = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-bulk');
    const catOpts = Object.keys(Bulk.info.categories).map(function (k) { return '<option value="' + k + '"' + (k === Bulk.category ? ' selected' : '') + '>' + E(Bulk.info.categories[k].label) + '</option>'; }).join('');
    root.innerHTML =
      '<section class="card" style="margin-bottom:12px"><div class="card-head"><h2>1. Choose what to upload</h2></div>' +
      '<div class="filter-bar" style="margin:0"><label class="filter"><span>Data category</span><select data-bulk="category"' + (Bulk.busy ? ' disabled' : '') + '>' + catOpts + '</select></label>' +
      (c.canUpdate ? '<label class="filter"><span>What should happen to existing records?</span><select data-bulk="mode"' + (Bulk.busy ? ' disabled' : '') + '><option value="insert"' + (Bulk.mode === 'insert' ? ' selected' : '') + '>Add new records only (safe)</option><option value="update"' + (Bulk.mode === 'update' ? ' selected' : '') + '>Update existing records (changes data)</option></select></label>' : '') +
      '<button class="btn" type="button" data-action="bulk-template">' + I('download', 16) + 'Download CSV template</button></div>' +
      (Bulk.mode === 'update' ? '<div class="banner banner-warn" style="margin:0 16px 14px">' + I('alert', 18) + '<div>Update mode changes records that already exist. You will see exactly what changes before confirming.</div></div>' : '') + '</section>' +
      guideCard() +
      '<section class="card" style="margin-bottom:12px"><div class="card-head"><h2>2. Upload your filled-in file</h2><span class="muted small">CSV only · up to ' + Bulk.info.maxRows + ' rows and ' + (MAX_FILE_BYTES / 1024) + ' KB per file</span></div>' +
      '<div style="padding:0 16px 16px"><input type="file" id="bulk-file" accept=".csv,text/csv" data-bulk="file"' + (Bulk.busy ? ' disabled' : '') + '><p class="muted small" style="margin-top:8px">The file is checked on the server first. <strong>Nothing is saved until you confirm.</strong> Existing records are never overwritten or deleted in "Add new" mode.</p></div></section>' +
      previewCard() + resultCard();
    if (keep) { const el = root.querySelector('[data-bulk="' + keep + '"]'); if (el && el.focus && keep !== 'file') el.focus(); }
  }

  Pages.bulk = {
    title: 'Bulk Upload', desc: 'Add many employees, devices, allotments or returns at once from a CSV file.', defaults: {},
    actions: function () { return ''; },
    load: async function () { if (!Bulk.info) Bulk.info = await DataService.bulkInfo(); },
    render: function (c) { c.innerHTML = '<div id="bulk-root"></div>'; drawBulk(); }
  };

  /* ------------------------------------------------------------------ Administrators page */

      { key: 'name', label: 'Name', render: function (a) { return E(a.name) + (a.you ? ' ' + B('You', 'blue') : ''); } },
      { key: 'username', label: 'Username' }, { key: 'active', label: 'Status', render: function (a) { return a.active ? B('Active', 'green') : B('Disabled', 'grey'); } },
      { key: 'created', label: 'Added', render: function (a) { return fmt(a.created); } }, { key: 'approvedBy', label: 'Approved by' },
      { key: 'x', label: '', render: function (a) { return a.you ? '' : '<button class="btn btn-sm" type="button" data-action="admin-toggle" data-id="' + E(a.username) + '" data-on="' + (a.active ? '0' : '1') + '">' + (a.active ? 'Disable' : 'Enable') + '</button>'; } }

      { key: 'x', label: '', render: function (r) { return '<button class="btn btn-sm btn-primary" type="button" data-action="admin-approve" data-id="' + E(r.username) + '">Approve</button> <button class="btn btn-sm" type="button" data-action="admin-reject" data-id="' + E(r.username) + '">Reject</button>'; } }
    ], rows: d.requests }) : UI.empty({ title: 'No requests waiting', text: 'People can ask for access from the login page. You will approve them here.', icon: 'user' });
    c.innerHTML =
      '<section class="card" style="margin-bottom:12px"><div class="card-head"><h2>Access requests</h2><span class="muted small">A request gives no access until you approve it.</span></div>' + reqs + '</section>' +

      '<form class="pw-form" novalidate style="padding:0 16px 16px;max-width:460px"><div class="form-alert" role="alert" hidden></div>' +
      UI.field({ name: 'currentPassword', label: 'Current password', type: 'password', required: true }) + UI.field({ name: 'newPassword', label: 'New password', type: 'password', required: true }) + UI.field({ name: 'confirmPassword', label: 'Repeat new password', type: 'password', required: true }) +
      '<p class="muted small" style="margin:4px 0 10px">At least 10 characters, with letters and numbers.</p><button class="btn btn-primary" type="submit">Change password</button></form></section>';

  Pages.admins = {
    title: 'Administrators', desc: 'Approve access requests and manage who can change data.', defaults: {},
    actions: function () { return ''; },
    load: async function () { Admins.data = await DataService.adminList(); },
    render: function (c) { adminsView(c); }
  };
  async function adminCall(fn, args, okMsg) {
    try { Admins.data = await fn.apply(null, args); UI.toast(okMsg, 'success'); await App.render({ silent: true }); }
    catch (err) { UI.toast(err.message, 'error', 'Not done'); }
  }

  /* ------------------------------------------------------------------ events */
  const A = App.actions;
  A['bulk-template'] = downloadTemplate;
  A['bulk-confirm'] = confirmImport;
  A['bulk-errors'] = errorReport;
  A['bulk-cancel'] = function () { resetFile(); rerender(); };
  A['bulk-clear-result'] = function () { Bulk.result = null; rerender(); };
  A['admin-approve'] = async function (el) {
    if (await UI.confirm({ title: 'Approve ' + el.dataset.id + '?', confirmText: 'Approve', message: '<p>This person will be able to sign in and <strong>change all dashboard data</strong>.</p>' })) adminCall(DataService.adminApprove, [el.dataset.id], el.dataset.id + ' can now sign in.');
  };
  A['admin-reject'] = async function (el) {
    if (await UI.confirm({ title: 'Reject ' + el.dataset.id + '?', tone: 'danger', confirmText: 'Reject', message: '<p>The request will be removed.</p>' })) adminCall(DataService.adminReject, [el.dataset.id], 'Request rejected.');
  };
  A['admin-toggle'] = async function (el) {
    const on = el.dataset.on === '1';
    if (await UI.confirm({ title: (on ? 'Enable ' : 'Disable ') + el.dataset.id + '?', tone: on ? '' : 'danger', confirmText: on ? 'Enable' : 'Disable', message: '<p>' + (on ? 'This administrator will be able to sign in again.' : 'This administrator is signed out immediately and cannot sign in until enabled again.') + '</p>' })) adminCall(DataService.adminSetActive, [el.dataset.id, on], el.dataset.id + (on ? ' enabled.' : ' disabled.'));
  };

  document.addEventListener('change', function (ev) {
    const el = ev.target.closest && ev.target.closest('[data-bulk]'); if (!el || !Bulk.info) return;
    const k = el.getAttribute('data-bulk');
    if (k === 'file') { onFile(el.files && el.files[0]); return; }
    if (k === 'category') { Bulk.category = el.value; Bulk.mode = 'insert'; resetFile(); rerender(); return; }
    if (k === 'mode') { Bulk.mode = el.value; resetFile(); rerender(); return; }
    if (k === 'strict') Bulk.strict = el.checked;
    if (k === 'confirmUpdate') Bulk.confirmUpdate = el.checked;
    if (k === 'onlyErrors') { Bulk.onlyErrors = el.checked; UI.resetPage('bulk-preview'); }
    rerender();
  });

  document.addEventListener('submit', async function (ev) {
    const f = ev.target.closest && ev.target.closest('form.pw-form'); if (!f) return;
    ev.preventDefault();
    const v = { currentPassword: f.elements.currentPassword.value, newPassword: f.elements.newPassword.value, confirmPassword: f.elements.confirmPassword.value }, btn = f.querySelector('button[type="submit"]');
    if (v.newPassword !== v.confirmPassword) { UI.showErrors(f, { confirmPassword: 'The two new passwords do not match.' }); return; }
    UI.clearErrors(f); btn.disabled = true;
    try { await DataService.changePassword({ currentPassword: v.currentPassword, newPassword: v.newPassword }); f.reset(); UI.toast('Your password was changed.', 'success', 'Password changed'); }
    catch (err) { UI.showErrors(f, err.fields || {}, err.message); }
    btn.disabled = false;
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
